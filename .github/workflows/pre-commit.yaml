name: Run linters using pre-commit

on:
  pull_request:
    branches: [main]
  push:

jobs:
  pre-commit:
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v3
    - name: pre-commit
      run : |
        pip install pre-commit
        pre-commit install
        pre-commit run --all-files
